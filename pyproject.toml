[project]
name = "py-fs-shell"
version = "0.0.2"
description = "Python virtual filesystem with structured state backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "semversioner>=2.0", "build>=1.2", "twine>=5.0", "hatchling>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_fs_shell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
